<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasifikasi Sampah - Pilah AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-green-300 to-blue-400 min-h-screen flex items-center justify-center p-4 font-inter text-gray-800">

    <div id="prediction-main-container" class="container card-no-bg"> 
        <h1 class="text-4xl font-extrabold text-gray-800 mb-6">Pilah AI</h1>
        <p class="text-gray-600 mb-8">Pilih metode klasifikasi Anda.</p>

        <div class="flex justify-center items-center gap-4 mb-6">
            <button id="toggleCameraModeButton" class="button-secondary px-4 py-2">Gunakan Kamera</button>
            <button id="toggleUploadModeButton" class="button-secondary px-4 py-2">Unggah Gambar</button>
        </div>

        <div id="cameraModeSection" class="hidden">
            <div class="video-container relative w-full aspect-video bg-gray-200 rounded-lg overflow-hidden mb-6 shadow-inner">
                <video id="cameraFeed" autoplay playsinline></video>
                <canvas id="captureCanvas" class="hidden"></canvas>
                <div id="noCameraMessage" class="no-camera-message hidden">
                    Kamera tidak tersedia. Pastikan Anda memberikan izin akses dan menggunakan HTTPS/localhost.
                </div>
            </div>
            <div class="flex flex-col space-y-4 mb-6">
                <button id="cameraToggleButton" class="button-secondary">Nyalakan Kamera</button>
                <button id="captureButton" class="button-primary">Ambil Gambar & Klasifikasi</button>
                <button id="retakeButton" class="button-secondary hidden">Ambil Ulang</button>
            </div>
        </div>

        <div id="uploadModeSection" class="hidden">
            <div class="input-group mb-6">
                <label for="imageUpload" class="block text-gray-700 text-sm font-semibold mb-2 text-left">Unggah Gambar dari Lokal:</label>
                <input type="file" id="imageUpload" accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200 ease-in-out">
                <canvas id="uploadedPreviewCanvas" class="preview-image hidden mx-auto mt-4 rounded-lg border border-gray-300"></canvas>
            </div>
            <button id="uploadButton" class="button-primary">Klasifikasikan Gambar</button>
        </div>

        <div id="resultArea" class="result-area card-no-bg">
            <h2 class="text-2xl font-semibold text-gray-700 mb-3">Hasil Prediksi:</h2>
            <p id="predictionText" class="text-3xl font-extrabold text-purple-700 mb-2">Menunggu gambar...</p>
            <div id="loadingIndicator" class="mt-4 hidden">
                <div class="loading-spinner"></div>
                <p class="text-blue-500 mt-2">Mengklasifikasi...</p>
            </div>
        </div>

        <div id="messageBox" class="message-box-overlay hidden">
            <div class="message-box-content">
                <p id="messageText" class="text-lg text-gray-800 mb-4"></p>
                <button id="messageBoxClose" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-full">Tutup</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>

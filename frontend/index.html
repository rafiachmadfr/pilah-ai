<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilah AI - Klasifikasi Sampah Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-green-300 to-blue-400 min-h-screen flex items-center justify-center p-4 font-inter text-gray-800">

    <div class="landing-page-wrapper w-full text-center"> 
        <h1 class="text-5xl font-extrabold text-blue-700 mb-4 tracking-tight">Pilah AI</h1>
        <p class="text-xl text-gray-600 mb-8">Klasifikasikan sampah Anda dengan cerdas menggunakan kamera!</p>

        <a href="prediction.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300 mb-10">
            Mulai Pilah Sekarang!
        </a>

        <h2 class="text-3xl font-bold text-gray-700 mb-6">Contoh Sampah yang Dapat Dikenali:</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card"> 
                <img src="img/organik_example.jpg" alt="Contoh Sampah Organik" class="rounded-t-lg w-full h-40 object-cover mb-4"> 
                <div class="text-center">
                    <h3 class="text-lg font-semibold text-green-700 mb-2">Organik</h3>
                    <p class="text-sm text-gray-600">Sisa makanan, daun kering, dsb.</p>
                </div>
            </div>
            <div class="card"> 
                <img src="img/anorganik_example.jpg" alt="Contoh Sampah Anorganik" class="rounded-t-lg w-full h-40 object-cover mb-4"> 
                <div class="text-center">
                    <h3 class="text-lg font-semibold text-yellow-700 mb-2">Anorganik</h3>
                    <p class="text-sm text-gray-600">Plastik, kaleng, botol kaca, dsb.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
